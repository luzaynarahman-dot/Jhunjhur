<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Galada&family=Montserrat:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 6% 80px;
            background: var(--cream);
            text-align: center;
        }
        
        .error-content {
            max-width: 550px;
        }
        
        .error-number {
            font-family: "Allura", cursive;
            font-size: 8rem;
            color: var(--gold);
            line-height: 1;
            opacity: 0.3;
        }
        
        .error-content h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 2.5rem;
            color: var(--green);
            margin: 10px 0;
        }
        
        .error-content p {
            font-family: "Noto Serif Bengali", serif;
            font-size: 1rem;
            color: #6c665b;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        
        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .error-actions .btn-primary {
            padding: 12px 30px;
            background: var(--green);
            color: white;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-actions .btn-primary:hover {
            background: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(168, 117, 37, 0.25);
        }
        
        .error-actions .btn-secondary {
            padding: 12px 30px;
            background: transparent;
            color: var(--green);
            border: 1px solid rgba(168, 117, 37, 0.2);
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-actions .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }
        
        .error-search {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: white;
            border-radius: 50px;
            border: 1px solid rgba(168, 117, 37, 0.12);
        }
        
        .error-search i {
            color: var(--gold);
        }
        
        .error-search input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: "Montserrat", sans-serif;
            font-size: 0.85rem;
            color: var(--green);
        }
        
        .error-search input::placeholder {
            color: #b0a694;
        }
        
        .error-search button {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.7rem;
        }
        
        @media (max-width: 768px) {
            .error-number {
                font-size: 6rem;
            }
            
            .error-content h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<section class="error-page">

    <div class="error-content">

        <div class="error-number">404</div>
        
        <h1>পেজটি খুঁজে পাওয়া যায়নি</h1>
        
        <p>
            আপনি যে পেজটি খুঁজছেন সেটি সরানো হয়েছে, নাম পরিবর্তন করা হয়েছে অথবা
            এটি সাময়িকভাবে অনুপলব্ধ।
        </p>

        <div class="error-search">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="errorSearch" placeholder="পণ্য খুঁজুন...">
            <button onclick="searchProduct()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="error-actions">
            <a href="index.html" class="btn-primary">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="index.html#shop" class="btn-secondary">
                <i class="fa-solid fa-bag-shopping"></i> Shop
            </a>
            <a href="faq.html" class="btn-secondary">
                <i class="fa-solid fa-circle-question"></i> FAQ
            </a>
        </div>

    </div>

</section>

<script>
function searchProduct() {
    const query = document.getElementById('errorSearch').value.trim();
    if (query) {
        // Redirect to main site with search
        window.location.href = `index.html?search=${encodeURIComponent(query)}#shop`;
    }
}

// Enter key support
document.getElementById('errorSearch')?.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        searchProduct();
    }
});
</script>

</body>
</html>
