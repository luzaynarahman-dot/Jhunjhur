<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhunjhur Admin — Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream, #f7eee1);
            font-family: "Montserrat", sans-serif;
        }
        
        :root {
            --cream: #f7eee1;
            --cream-light: #fcf8f0;
            --green: #173c35;
            --gold: #a87525;
            --gold-light: #c59a56;
            --white: #fffdf8;
            --shadow: 0 20px 60px rgba(23, 60, 53, 0.15);
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-box {
            background: var(--white);
            padding: 45px 40px 40px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(168, 117, 37, 0.08);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        
        .login-logo h1 {
            font-family: "Allura", cursive;
            font-size: 2.5rem;
            color: var(--green);
            margin-top: 5px;
        }
        
        .login-logo small {
            display: block;
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 28px;
        }
        
        .login-title h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.8rem;
            color: var(--green);
        }
        
        .login-title p {
            font-size: 0.7rem;
            color: #70695d;
            margin-top: 4px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--green);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(168, 117, 37, 0.2);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--green);
            background: var(--cream-light);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            font-family: "Montserrat", sans-serif;
        }
        
        .form-group input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(168, 117, 37, 0.1);
        }
        
        .form-group .input-icon {
            position: relative;
        }
        
        .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            opacity: 0.5;
        }
        
        .form-group .input-icon input {
            padding-left: 42px;
        }
        
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 5px 0 22px;
        }
        
        .form-options label {
            font-size: 0.65rem;
            color: #70695d;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        
        .form-options label input {
            accent-color: var(--gold);
            width: 14px;
            height: 14px;
        }
        
        .form-options a {
            font-size: 0.65rem;
            color: var(--gold);
            text-decoration: none;
            transition: color 0.25s ease;
        }
        
        .form-options a:hover {
            color: var(--gold-light);
        }
        
        .login-btn {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            background: var(--green);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .login-btn:hover {
            background: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 117, 37, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-error {
            background: rgba(231, 76, 60, 0.08);
            color: #e74c3c;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            display: none;
            border-left: 3px solid #e74c3c;
        }
        
        .login-error.show {
            display: block;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.6rem;
            color: #b0a694;
        }
        
        .login-footer a {
            color: var(--gold);
            text-decoration: none;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .demo-credentials {
            background: rgba(168, 117, 37, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.65rem;
            color: #70695d;
            border: 1px dashed rgba(168, 117, 37, 0.15);
            text-align: center;
        }
        
        .demo-credentials strong {
            color: var(--green);
        }
        
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 22px 28px;
            }
            
            .login-logo h1 {
                font-size: 2rem;
            }
            
            .login-title h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    
    <div class="login-box">
        
        <!-- Logo -->
        <div class="login-logo">
            <img src="../assets/jhunjhur-logo.png" alt="Jhunjhur">
            <h1>Jhunjhur</h1>
            <small>Admin Panel</small>
        </div>
        
        <!-- Title -->
        <div class="login-title">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your store</p>
        </div>
        
        <!-- Error Message -->
        <div class="login-error" id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i>
            Invalid username or password. Please try again.
        </div>
        
        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <strong>🔑 Demo Login:</strong> 
            Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-icon">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" placeholder="Enter username" value="admin" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" value="admin123" required>
                </div>
            </div>
            
            <div class="form-options">
                <label>
                    <input type="checkbox" checked>
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>
        </form>
        
        <!-- Footer -->
        <div class="login-footer">
            &copy; 2026 Jhunjhur. All rights reserved.<br>
            <a href="../index.html">← Back to Website</a>
        </div>
        
    </div>
    
</div>

<script>
document.getElementById('loginForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const error = document.getElementById('loginError');
    
    // Demo credentials
    const validUsername = 'admin';
    const validPassword = 'admin123';
    
    if (username === validUsername && password === validPassword) {
        // Login success
        error.classList.remove('show');
        localStorage.setItem('jhunjhurAdmin', JSON.stringify({
            loggedIn: true,
            username: username,
            loginTime: new Date().toISOString()
        }));
        window.location.href = 'dashboard.html';
    } else {
        // Login failed
        error.classList.add('show');
        setTimeout(() => {
            error.classList.remove('show');
        }, 3000);
    }
});

// Enter key support
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        document.getElementById('loginForm')?.dispatchEvent(new Event('submit'));
    }
});
</script>

</body>
</html>
